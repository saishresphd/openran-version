logger:
  file:
    path: /var/log/open5gs/upf.log

upf:
  pfcp:
    server:
      - address: 127.0.0.7
  gtpu:
    server:
      - address: 10.10.1.1      # core LAN IP — gNBs send GTP-U packets here (N3)
  session:
    - subnet: 10.45.0.1/16      # UE PDN address pool
      gateway: 10.45.0.1
  metrics:
    server:
      - address: 127.0.0.7
        port: 9090
