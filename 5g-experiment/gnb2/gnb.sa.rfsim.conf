Active_gNBs = ( "gNB-OAI");
Asn1_verbosity = "none";

# OAI nr-softmodem — 5G SA, RFsimulator (no hardware)
# Node: gnb2 (pc811), LAN IP: 10.10.1.3
# Core AMF: core (pc808), LAN IP: 10.10.1.1
# UE: uehost2 (pc818) connects via --rfsimulator.serveraddr 10.10.1.3
#
# Start:
#   sudo /tmp/openairinterface5g/cmake_targets/ran_build/build/nr-softmodem \
#     -O /etc/oai_gnb/gnb.sa.rfsim.conf \
#     --rfsim \
#     --log_config.global_log_options level,nocolor,time

gNBs =
(
 {
    GNB_ID    = 0xe00;
    gNB_name  = "gNB-OAI";

    plmn_list = ({
      mcc = 1;
      mnc = 1;
      mnc_length = 2;
      snssaiList = ({ sst = 1; });
    });

    tracking_area_code  = 7;
    nr_cellid           = 12345678L;
    min_rxtxtime        = 6;

    servingCellConfigCommon = (
    {
      physCellId                                                    = 0;

      # Band n78 (TDD, 3.5 GHz)
      absoluteFrequencySSB                                          = 641272;
      dl_frequencyBand                                              = 78;
      dl_absoluteFrequencyPointA                                    = 640000;
      dl_offstToCarrier                                             = 0;
      dl_subcarrierSpacing                                          = 1;       # 30 kHz
      dl_carrierBandwidth                                           = 106;     # 20 MHz
      initialDLBWPlocationAndBandwidth                              = 28875;
      initialDLBWPsubcarrierSpacing                                 = 1;
      initialDLBWPcontrolResourceSetZero                            = 12;
      initialDLBWPsearchSpaceZero                                   = 0;

      ul_frequencyBand                                              = 78;
      ul_offstToCarrier                                             = 0;
      ul_subcarrierSpacing                                          = 1;
      ul_carrierBandwidth                                           = 106;
      initialULBWPlocationAndBandwidth                              = 28875;
      initialULBWPsubcarrierSpacing                                 = 1;

      pMax                                                          = 20;

      # PRACH parameters
      prach_ConfigurationIndex                                      = 98;
      prach_msg1_FDM                                                = 0;
      prach_msg1_FrequencyStart                                     = 0;
      zerokorrelationZoneConfig                                     = 13;
      preambleReceivedTargetPower                                   = -96;
      preamblTransMax                                               = 6;
      powerRampingStep                                              = 1;
      ra_ResponseWindow                                             = 4;
      ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR                  = 4;
      ssb_perRACH_OccasionAndCB_PreamblesPerSSB                     = 14;
      ra_ContentionResolutionTimer                                  = 7;
      rsrp_ThresholdSSB                                             = 19;
      prach_RootSequenceIndex_PR                                    = 2;
      prach_RootSequenceIndex                                       = 1;
      msg1_SubcarrierSpacing                                        = 1;
      restrictedSetConfig                                           = 0;
      msg3_DeltaPreamble                                            = 1;
      p0_NominalWithGrant                                           = -90;

      # PUCCH
      pucch_GroupHopping                                            = 0;
      hoppingId                                                     = 40;
      p0_nominal                                                    = -90;

      # SSB
      ssb_PositionsInBurst_PR                                       = 2;
      ssb_PositionsInBurst_Bitmap                                   = 1;
      ssb_periodicityServingCell                                    = 2;

      dmrs_TypeA_Position                                           = 0;

      # TDD pattern: 7DL + 6UL per 10ms frame
      referenceSubcarrierSpacing                                    = 1;
      dl_UL_TransmissionPeriodicity                                 = 6;
      nrofDownlinkSlots                                             = 7;
      nrofDownlinkSymbols                                           = 6;
      nrofUplinkSlots                                               = 2;
      nrofUplinkSymbols                                             = 4;

      ssPBCH_BlockPower                                             = -25;
    }
    );

    # AMF address — Open5GS on core node
    AMF_IP_ADDRESS = ({
      ipv4       = "10.10.1.1";
      ipv6       = "192:168:30::17";
      active     = "yes";
      preference = "ipv4";
    });

    # Network interfaces — gnb2 (pc811)
    NETWORK_INTERFACES :
    {
      GNB_INTERFACE_NAME_FOR_NG_AMF  = "enp4s0f1";   # LAN interface on pc811
      GNB_IPV4_ADDRESS_FOR_NG_AMF    = "10.10.1.3";
      GNB_INTERFACE_NAME_FOR_NGU     = "enp4s0f1";
      GNB_IPV4_ADDRESS_FOR_NGU       = "10.10.1.3";
      GNB_PORT_FOR_S1U               = 2152;
    };
  }
);
