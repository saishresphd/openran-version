# srsUE — 5G NR SA mode, ZMQ virtual RF
# Node: uehost1 (pc801), LAN IP: 10.10.1.4
# Connects to: gnb1 (pc802) ZMQ ports 2000/2001
#
# Prerequisites:
#   sudo ip netns add ue1
# Start:
#   sudo srsue /etc/srsran/ue_zmq.conf

[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 11.52e6
nof_antennas = 1
device_name = zmq
# UE TX → gNB RX port (2001), UE RX ← gNB TX port (2000)
device_args = tx_port=tcp://10.10.1.2:2001,rx_port=tcp://10.10.1.2:2000,base_srate=11.52e6

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0             # Disable LTE — force NR only

[rat.nr]
bands = 3                    # NR Band n3 (FDD) — must match gNB band
nof_carriers = 1
max_nof_prb = 52             # 10 MHz bandwidth
nof_prb = 52

[usim]
mode = soft
algo = milenage
opc  = 63bfa50ee6523365ff14c1f45f88737d
k    = 00112233445566778899aabbccddeeff
imsi = 001010123456780
imei = 353490069873319

[rrc]
release = 15                 # NR release (required for 5G SA)
ue_category = 4

[nas]
apn = srsapn
apn_protocol = ipv4

[gw]
netns = ue1                  # UE TUN interface goes into ue1 network namespace
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[log]
filename = /tmp/ue1_srsran.log
all_level = info
